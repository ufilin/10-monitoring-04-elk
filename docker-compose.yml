version: '3.8'

services:
  # Elasticsearch Hot Node
  es-hot:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: es-hot
    environment:
      - node.name=es-hot
      - node.roles=data_hot,data_content,master,ingest
      - cluster.name=elk-cluster
      - cluster.initial_master_nodes=es-hot,es-warm
      - discovery.seed_hosts=es-warm
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch/hot:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk-network
    restart: unless-stopped

  # Elasticsearch Warm Node
  es-warm:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: es-warm
    environment:
      - node.name=es-warm
      - node.roles=data_warm,data_content,master,ingest
      - cluster.name=elk-cluster
      - cluster.initial_master_nodes=es-hot,es-warm
      - discovery.seed_hosts=es-hot
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch/warm:/usr/share/elasticsearch/data
    networks:
      - elk-network
    restart: unless-stopped

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: kibana
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://es-hot:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    ports:
      - "5601:5601"
    networks:
      - elk-network
    restart: unless-stopped
    depends_on:
      - es-hot
      - es-warm

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.0
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config:/usr/share/logstash/config
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
    networks:
      - elk-network
    restart: unless-stopped
    depends_on:
      - es-hot

  # Filebeat
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elk-network
    restart: unless-stopped
    depends_on:
      - logstash

networks:
  elk-network:
    driver: bridge
